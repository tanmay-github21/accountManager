<template>
    <lightning-card title="Custom Insertion Error Handling">
        <div class="slds-m-around_medium">
            <p class="slds-text-body_regular slds-m-bottom_medium">Click Here to open record creation modal </p>
            <lightning-button label="Open Create Account Modal" variant="brand" icon-name="utility:add" onclick={openModal}></lightning-button>
        </div>
    </lightning-card>
    <template lwc:if={isModalOpen}>
         <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                    <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                    </button>
                    <h2 class="slds-modal__title slds-hyphenate"> Create New Account Record</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <!--ERROR SCENARIO TEST SELECTOR-->
                    <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                        <lightning-combobox name="errorType" label="Select the error scenario you want to test" 
                        value={selectedErrorScenario} 
                        options={errorScenarioOptions} 
                        onchange={handleErrorScenarioChange}></lightning-combobox>
                    </div>
                    <!--INPUT FIELDS-->
                    <lightning-input label="Account Name" value={formAccount.Name} onchange={handleFormChange} data-field="Name" required></lightning-input>
                    <lightning-input label="Account Industry" value={formAccount.Industry} data-field="Industry" onchange={handleFormChange}></lightning-input>
                    <lightning-input label="Account Phone" value={formAccount.Phone} onchange={handleFormChange} data-field="Phone"></lightning-input>
                    <lightning-input label="Account Website" value={formAccount.Website} onchange={handleFormChange} data-field="Website"></lightning-input>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Save Account" variant="brand" onclick={handleSaveAccount}></lightning-button>
                    <lightning-button label="Cancel" variant="neutral" onclick={closeModal} class="slds-m-right_x-small"></lightning-button>
                </footer>
            </div>
         </section>
         <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
